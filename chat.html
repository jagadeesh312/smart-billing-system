<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat with Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body class="with-shell">
    <header class="site-header glass">
      <a class="logo" href="home.html">
        <img src="logo.png" alt="Logo" class="logo-img" />
        <span>SBAS</span>
      </a>
      <nav class="top-nav">
        <a href="home.html">Home</a>
        <a href="ai-voice.html">AI Voice</a>
        <a class="active" href="live-chat.html">Live Chat</a>
        <a href="main.html">Billing</a>
      </nav>
    </header>

    <main class="app-shell single with-header">
      <section class="chat-panel glass">
        <header class="chat-header">
          <div>
            <h2 id="chat-title">Chat with Admin</h2>
            <p id="chat-meta">Connecting...</p>
          </div>

          <div class="profile-menu">
            <button id="profile-btn" class="profile-btn" type="button">Profile</button>
            <div id="profile-dropdown" class="profile-dropdown glass hidden">
              <p id="profile-info">...</p>
              <button id="logout-btn" class="secondary-btn" type="button">Logout</button>
            </div>
          </div>
        </header>

        <div id="chat-error" class="error-box hidden"></div>
        <div id="blocked-box" class="warn-box hidden"></div>
        <div id="typing-indicator" class="typing-text hidden"></div>
        <div id="messages" class="messages"></div>

        <div class="message-compose">
          <textarea id="message-input" class="message-input" placeholder="Type a message" disabled></textarea>
          <button id="send-btn" class="send-btn" type="button" disabled title="Send">Send</button>
        </div>
      </section>
    </main>

    <script src="./env.js"></script>
    <script type="module" src="./user.js"></script>
  </body>
</html>
