<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Language</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url("https://i.pinimg.com/736x/b0/21/06/b0210669be120b2c1b2d2cc4f25bfcbd.jpg");
  background-size: cover;
  background-position: center;

  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* TOP BAR */
.top-bar {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 10px;

  padding: 10px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(16px);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.25);
}

.back-btn {
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
  color: white;

  background: rgba(71,85,105,0.45);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 10px;
}

/* CENTER CARD */
.container {
  width: 320px;
  padding: 30px;
  text-align: center;

  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(18px);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
}

h1 {
  margin-bottom: 20px;
  font-size: 22px;
}

.lang-btn {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
  cursor: pointer;
  color: white;

  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  transition: 0.3s;
}

.lang-btn:hover {
  background: rgba(255,255,255,0.35);
  transform: scale(1.03);
}
</style>
</head>

<body>

<!-- TOP BAR WITH BACK -->
<div class="top-bar">
  <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<!-- LANGUAGE CARD -->
<div class="container">
  <h1>🌐 Select Language</h1>

  <button class="lang-btn" onclick="go('english.html')">English</button>
  <button class="lang-btn" onclick="go('tamil.html')">தமிழ்</button>
  <button class="lang-btn" onclick="go('hindi.html')">हिंदी</button>
  <button class="lang-btn" onclick="go('kannada.html')">ಕನ್ನಡ</button>
  <button class="lang-btn" onclick="go('malayalam.html')">മലയാളം</button>
</div>

<script>
function go(page) {
  window.location.href = page;
}

function goBack() {
  history.back();
}
</script>

</body>
</html>
