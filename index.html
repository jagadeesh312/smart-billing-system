<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Language</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Billing AI — choose language">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<!-- TOP BAR WITH BACK -->
<div class="top-bar">
  <button class="back-btn" aria-label="Go back">⬅ Back</button>
</div>

<!-- LANGUAGE CARD -->
<div class="container">
  <h1>🌐 Select Language</h1>

  <button class="lang-btn" data-page="english.html" aria-label="Select English">English</button>
  <button class="lang-btn" data-page="tamil.html" aria-label="Select Tamil">தமிழ்</button>
  <button class="lang-btn" data-page="hindi.html" aria-label="Select Hindi">हिंदी</button>
  <button class="lang-btn" data-page="kannada.html" aria-label="Select Kannada">ಕನ್ನಡ</button>
  <button class="lang-btn" data-page="malayalam.html" aria-label="Select Malayalam">മലയാളം</button>
</div>

<script>
/* =====================
   DOM CACHE
===================== */
const DOM = {
  backBtn: document.querySelector(".back-btn"),
  langBtns: document.querySelectorAll(".lang-btn")
};

/* =====================
   EVENT LISTENERS
===================== */
DOM.backBtn.addEventListener("click", goBack);

DOM.langBtns.forEach(btn => {
  btn.addEventListener("click", (e) => {
    const page = e.target.getAttribute("data-page");
    if (page) {
      navigateToPage(page);
    }
  });
});

/* =====================
   FUNCTIONS
===================== */
function navigateToPage(page) {
  try {
    window.location.href = page;
  } catch (e) {
    console.error("Navigation error:", e);
  }
}

function goBack() {
  try {
    history.back();
  } catch (e) {
    console.error("Navigation error:", e);
  }
}
</script>

</body>
</html>
