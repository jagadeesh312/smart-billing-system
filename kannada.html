<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<title>സ്മാർട്ട് ബില്ലിംഗ് AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Billing AI — voice-enabled billing app">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<!-- TOP CONTROLS -->
<div class="btn-row">
  <button class="btn-back" aria-label="പിൻവാങ്ങുക">⬅ പിൻവാങ്ങുക</button>
  <button class="btn-speak" aria-label="സംസാരിക്കുക">🎤 സംസാരിക്കുക</button>
</div>

<!-- MAIN APP -->
<div class="app">
  <h1>🧾 സ്മാർട്ട് ബില്ലിംഗ് AI</h1>
  <div class="status" id="status">സംസാരിക്കാൻ അമർത്തുക</div>
  <div class="log" id="log"></div>
  <div class="bill" id="bill"></div>
</div>

<script>
/* =====================
   CONFIGURATION
===================== */
const CONFIG = {
  lang: "ml-IN",
  speechLang: "ml-IN"
};

/* =====================
   DATA
===================== */
const PRODUCTS = {
  "പാൽ": 60,
  "അരി": 55,
  "പഞ്ചസാര": 45,
  "ബ്രെഡ്": 40
};

const NUMBER_WORDS = {
  "ഒരു": 1, "രണ്ട്": 2, "മൂന്ന്": 3, "നാല്": 4, "അഞ്ച്": 5,
  "ആറ്": 6, "ഏഴ്": 7, "എട്ട്": 8, "ഒമ്പത്": 9, "പത്ത്": 10
};

/* =====================
   DOM CACHE
===================== */
const DOM = {
  status: document.getElementById("status"),
  log: document.getElementById("log"),
  bill: document.getElementById("bill"),
  backBtn: document.querySelector(".btn-back"),
  speakBtn: document.querySelector(".btn-speak")
};

/* =====================
   STATE
===================== */
let bill = {};

/* =====================
   SPEECH SETUP
===================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = CONFIG.lang;
recognition.interimResults = false;

function startListening() {
  updateStatus("കേൾക്കുന്നു...");
  try {
    recognition.start();
  } catch (e) {
    console.error("Recognition already started");
  }
}

recognition.onresult = (e) => {
  const text = e.results[0][0].transcript;
  addLog("👤 " + text);
  handleCommand(text);
};

recognition.onerror = (e) => {
  updateStatus("പിശക്: " + e.error);
  console.error("Speech Recognition error:", e.error);
};

recognition.onend = () => updateStatus("സംസാരിക്കാൻ അമർത്തുക");

/* =====================
   COMMAND HANDLER
===================== */
function handleCommand(text) {

  if (text.includes("നീ ആരാണ്")) {
    speak("ഞാൻ സ്മാർട്ട് ബില്ലിംഗ് എ ഐ സംവിധാനം ആണ്.");
    return;
  }

  if (text.includes("നിന്നെ ആരാണ് സൃഷ്ടിച്ചത്")) {
    speak("എന്നെ എസ് ബി എ എസ് ടീവും ജഗദീഷും സൃഷ്ടിച്ചു.");
    return;
  }

  if (text.includes("തീയതി")) {
    const today = new Date().toLocaleDateString(CONFIG.lang, {
      day: "numeric", month: "long", year: "numeric"
    });
    speak(`ഇന്നത്തെ തീയതി ${today}`);
    return;
  }

  if (text.includes("ക്ലിയർ") || text.includes("എല്ലാം നീക്കം")) {
    bill = {};
    updateBillDisplay();
    speak("ബിൽ ക്ലിയർ ചെയ്തു.");
    return;
  }

  if (text.includes("വില")) {
    for (const item in PRODUCTS) {
      if (text.includes(item)) {
        speak(`${item} വില രൂപ ${PRODUCTS[item]}`);
        return;
      }
    }
  }

  if (text.includes("ആകെ")) {
    const total = calculateTotal();
    speak(`ആകെ തുക രൂപ ${total}`);
    return;
  }

  if (text.includes("വീണ്ടും")) {
    if (Object.keys(bill).length === 0) {
      speak("ബിൽ കാലിയാണു.");
      return;
    }
    const summary = Object.entries(bill).map(([item, qty]) => `${qty} ${item}`);
    speak(`നിങ്ങളുടെ ബിലിൽ ${summary.join(", ")}`);
    return;
  }

  if (text.includes("നീക്കം")) {
    let qty = getQuantityFromText(text);
    for (const item in bill) {
      if (text.includes(item)) {
        bill[item] -= qty;
        if (bill[item] <= 0) delete bill[item];
        updateBillDisplay();
        speak(`${qty} ${item} നീക്കം ചെയ്തു.`);
        return;
      }
    }
  }

  const parts = text.split("യും");
  const added = [];

  parts.forEach(part => {
    let qty = getQuantityFromText(part);
    for (const item in PRODUCTS) {
      if (part.includes(item)) {
        bill[item] = (bill[item] || 0) + qty;
        added.push(`${qty} ${item}`);
      }
    }
  });

  if (added.length) {
    updateBillDisplay();
    speak(`${added.join("യും")} ചേർത്തു.`);
    return;
  }

  speak("ക്ഷമിക്കണം, എനിക്ക് മനസ്സിലായില്ല.");
}

/* =====================
   BILL UI
===================== */
function updateBillDisplay() {
  let html = "<b>ബിൽ</b><br>";
  let total = 0;

  for (const item in bill) {
    const cost = bill[item] * PRODUCTS[item];
    total += cost;
    html += `${item} x ${bill[item]} = ₹${cost}<br>`;
  }

  html += `<b>ആകെ: ₹${total}</b>`;
  DOM.bill.innerHTML = html;
}

/* =====================
   HELPERS
===================== */
function calculateTotal() {
  let total = 0;
  for (const item in bill) {
    total += bill[item] * PRODUCTS[item];
  }
  return total;
}

function getQuantityFromText(text) {
  for (const numWord in NUMBER_WORDS) {
    if (text.includes(numWord)) {
      return NUMBER_WORDS[numWord];
    }
  }
  return 1;
}

function speak(text) {
  addLog("🤖 " + text);
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = CONFIG.speechLang;
  try {
    speechSynthesis.speak(utterance);
  } catch (e) {
    console.error("Speech synthesis error:", e);
  }
}

function addLog(text) {
  DOM.log.innerHTML += text + "<br>";
  DOM.log.scrollTop = DOM.log.scrollHeight;
}

function updateStatus(text) {
  DOM.status.innerText = text;
}

function goBack() {
  window.location.href = 'index.html';
}

/* =====================
   EVENT LISTENERS
===================== */
DOM.backBtn.addEventListener("click", goBack);
DOM.speakBtn.addEventListener("click", startListening);
</script>

</body>
</html>
