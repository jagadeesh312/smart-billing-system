<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<title>ಸ್ಮಾರ್ಟ್ ಬಿಲ್ಲಿಂಗ್ AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Billing AI — voice-enabled billing app">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<!-- TOP CONTROLS -->
<div class="btn-row">
  <button class="btn-back" aria-label="ಹಿಂದಿರುಗಿ">⬅ ಹಿಂದಿರುಗು</button>
  <button class="btn-speak" aria-label="ಮಾತ್ರವಾಗಲು ಪ್ರಾರಂಭಿಸಿ">🎤 ಮಾತಾಡಿ</button>
</div>

<!-- MAIN APP -->
<div class="app">
  <h1>🧾 ಸ್ಮಾರ್ಟ್ ಬಿಲ್ಲಿಂಗ್ AI</h1>
  <div class="status" id="status">ಮಾತಾಡಲು ಒತ್ತಿರಿ</div>
  <div class="log" id="log"></div>
  <div class="bill" id="bill"></div>
</div>

<script>
/* =====================
   CONFIGURATION
===================== */
const CONFIG = {
  lang: "kn-IN",
  speechLang: "kn-IN"
};

/* =====================
   DATA
===================== */
const PRODUCTS = {
  "ಹಾಲು": 60,
  "ಅಕ್ಕಿ": 55,
  "ಸಕ್ಕರೆ": 45,
  "ರೊಟ್ಟಿ": 40
};

const NUMBER_WORDS = {
  "ಒಂದು": 1, "ಎರಡು": 2, "ಮೂರು": 3, "ನಾಲ್ಕು": 4, "ಐದು": 5,
  "ಆರು": 6, "ಏಳು": 7, "ಎಂಟು": 8, "ಒಂಬತ್ತು": 9, "ಹತ್ತು": 10
};

/* =====================
   DOM CACHE
===================== */
const DOM = {
  status: document.getElementById("status"),
  log: document.getElementById("log"),
  bill: document.getElementById("bill"),
  backBtn: document.querySelector(".btn-back"),
  speakBtn: document.querySelector(".btn-speak")
};

/* =====================
   STATE
===================== */
let bill = {};

/* =====================
   SPEECH SETUP
===================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = CONFIG.lang;
recognition.interimResults = false;

function startListening() {
  updateStatus("ಕೆಳಿಸುತ್ತಿದೆ...");
  try {
    recognition.start();
  } catch (e) {
    console.error("Recognition already started");
  }
}

recognition.onresult = (e) => {
  const text = e.results[0][0].transcript;
  addLog("👤 " + text);
  handleCommand(text);
};

recognition.onerror = (e) => {
  updateStatus("ದೋಷ: " + e.error);
  console.error("Speech Recognition error:", e.error);
};

recognition.onend = () => updateStatus("ಮಾತಾಡಲು ಒತ್ತಿರಿ");

/* =====================
   COMMAND HANDLER
===================== */
function handleCommand(text) {

  if (text.includes("ನೀನು ಯಾರು")) {
    speak("ನಾನು ಸ್ಮಾರ್ಟ್ ಬಿಲ್ಲಿಂಗ್ ಎಐ ವ್ಯವಸ್ಥೆ.");
    return;
  }

  if (text.includes("ನಿನ್ನನ್ನು ಯಾರು ನಿರ್ಮಿಸಿದರು")) {
    speak("ನನ್ನನ್ನು ಎಸ್ ಬಿ ಎ ಎಸ್ ತಂಡ ಮತ್ತು ಜಗದೀಶ್ ನಿರ್ಮಿಸಿದ್ದಾರೆ.");
    return;
  }

  if (text.includes("ದಿನಾಂಕ")) {
    const today = new Date().toLocaleDateString(CONFIG.lang, {
      day: "numeric", month: "long", year: "numeric"
    });
    speak(`ಇಂದಿನ ದಿನಾಂಕ ${today}`);
    return;
  }

  if (text.includes("ಕ್ಲಿಯರ್") || text.includes("ಎಲ್ಲವನ್ನೂ ತೆಗೆ")) {
    bill = {};
    updateBillDisplay();
    speak("ಬಿಲ್ ಕ್ಲಿಯರ್ ಮಾಡಲಾಗಿದೆ.");
    return;
  }

  if (text.includes("ಬೆಲೆ")) {
    for (const item in PRODUCTS) {
      if (text.includes(item)) {
        speak(`${item} ಬೆಲೆ ರೂ ${PRODUCTS[item]}`);
        return;
      }
    }
  }

  if (text.includes("ಒಟ್ಟು")) {
    const total = calculateTotal();
    speak(`ಒಟ್ಟು ಮೊತ್ತ ರೂ ${total}`);
    return;
  }

  if (text.includes("ಮರುಕಳಿ")) {
    if (Object.keys(bill).length === 0) {
      speak("ಬಿಲ್ ಖಾಲಿಯಾಗಿದೆ.");
      return;
    }
    const summary = Object.entries(bill).map(([item, qty]) => `${qty} ${item}`);
    speak(`ನಿಮ್ಮ ಬಿಲ್ಲಿನಲ್ಲಿ ${summary.join(", ")}`);
    return;
  }

  if (text.includes("ತೆಗೆ")) {
    let qty = getQuantityFromText(text);
    for (const item in bill) {
      if (text.includes(item)) {
        bill[item] -= qty;
        if (bill[item] <= 0) delete bill[item];
        updateBillDisplay();
        speak(`${qty} ${item} ತೆಗೆದುಹಾಕಲಾಗಿದೆ.`);
        return;
      }
    }
  }

  const parts = text.split(" ಮತ್ತು ");
  const added = [];

  parts.forEach(part => {
    let qty = getQuantityFromText(part);
    for (const item in PRODUCTS) {
      if (part.includes(item)) {
        bill[item] = (bill[item] || 0) + qty;
        added.push(`${qty} ${item}`);
      }
    }
  });

  if (added.length) {
    updateBillDisplay();
    speak(`${added.join(" ಮತ್ತು ")} ಸೇರಿಸಲಾಗಿದೆ.`);
    return;
  }

  speak("ಕ್ಷಮಿಸಿ, ನನಗೆ ಅರ್ಥವಾಗಲಿಲ್ಲ.");
}

/* =====================
   BILL UI
===================== */
function updateBillDisplay() {
  let html = "<b>ಬಿಲ್</b><br>";
  let total = 0;

  for (const item in bill) {
    const cost = bill[item] * PRODUCTS[item];
    total += cost;
    html += `${item} x ${bill[item]} = ₹${cost}<br>`;
  }

  html += `<b>ಒಟ್ಟು: ₹${total}</b>`;
  DOM.bill.innerHTML = html;
}

/* =====================
   HELPERS
===================== */
function calculateTotal() {
  let total = 0;
  for (const item in bill) {
    total += bill[item] * PRODUCTS[item];
  }
  return total;
}

function getQuantityFromText(text) {
  for (const numWord in NUMBER_WORDS) {
    if (text.includes(numWord)) {
      return NUMBER_WORDS[numWord];
    }
  }
  return 1;
}

function speak(text) {
  addLog("🤖 " + text);
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = CONFIG.speechLang;
  try {
    speechSynthesis.speak(utterance);
  } catch (e) {
    console.error("Speech synthesis error:", e);
  }
}

function addLog(text) {
  DOM.log.innerHTML += text + "<br>";
  DOM.log.scrollTop = DOM.log.scrollHeight;
}

function updateStatus(text) {
  DOM.status.innerText = text;
}

function goBack() {
  window.location.href = 'index.html';
}

/* =====================
   EVENT LISTENERS
===================== */
DOM.backBtn.addEventListener("click", goBack);
DOM.speakBtn.addEventListener("click", startListening);
</script>

</body>
</html>
