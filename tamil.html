<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>ஸ்மார்ட் பில்லிங் AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Billing AI — voice-enabled billing app">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<!-- TOP CONTROLS -->
<div class="btn-row">
  <button class="btn-back" aria-label="பின்செல்">⬅ பின்செல்</button>
  <button class="btn-speak" aria-label="பேசு">🎤 பேசு</button>
</div>

<!-- MAIN APP -->
<div class="app">
  <h1>🧾 ஸ்மார்ட் பில்லிங் AI</h1>
  <div class="status" id="status">பேச தொடு</div>
  <div class="log" id="log"></div>
  <div class="bill" id="bill"></div>
</div>

<script>
/* =====================
   CONFIGURATION
===================== */
const CONFIG = {
  lang: "ta-IN",
  speechLang: "ta-IN"
};

/* =====================
   DATA
===================== */
const PRODUCTS = {
  "பால்": 60,
  "அரிசி": 55,
  "சர்க்கரை": 45,
  "ரொட்டி": 40
};

const NUMBER_WORDS = {
  "ஒரு": 1, "இரண்டு": 2, "மூன்று": 3, "நான்கு": 4, "ஐந்து": 5,
  "ஆறு": 6, "ஏழு": 7, "எட்டு": 8, "ஒன்பது": 9, "பத்து": 10
};

/* =====================
   DOM CACHE
===================== */
const DOM = {
  status: document.getElementById("status"),
  log: document.getElementById("log"),
  bill: document.getElementById("bill"),
  backBtn: document.querySelector(".btn-back"),
  speakBtn: document.querySelector(".btn-speak")
};

/* =====================
   STATE
===================== */
let bill = {};

/* =====================
   SPEECH SETUP
===================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = CONFIG.lang;
recognition.interimResults = false;

function startListening() {
  updateStatus("கேட்கிறது...");
  try {
    recognition.start();
  } catch (e) {
    console.error("Recognition already started");
  }
}

recognition.onresult = (e) => {
  const text = e.results[0][0].transcript;
  addLog("👤 " + text);
  handleCommand(text);
};

recognition.onerror = (e) => {
  updateStatus("பிழை: " + e.error);
  console.error("Speech Recognition error:", e.error);
};

recognition.onend = () => updateStatus("பேச தொடு");

/* =====================
   COMMAND HANDLER
===================== */
function handleCommand(text) {

  if (text.includes("நீ யார்")) {
    speak("நான் ஸ்மார்ட் பில்லிங் AI அமைப்பு.");
    return;
  }

  if (text.includes("உன்னை யார் உருவாக்கினார்கள்")) {
    speak("என்னை SBAS குழு மற்றும் ஜகதீஷ் உருவாக்கினார்கள்.");
    return;
  }

  if (text.includes("தேதி")) {
    const today = new Date().toLocaleDateString(CONFIG.lang, {
      day: "numeric", month: "long", year: "numeric"
    });
    speak(`இன்றைய தேதி ${today}`);
    return;
  }

  if (text.includes("கிளியர்") || text.includes("அனைத்தையும் நீக்கு")) {
    bill = {};
    updateBillDisplay();
    speak("பில் நீக்கப்பட்டது.");
    return;
  }

  if (text.includes("விலை")) {
    for (const item in PRODUCTS) {
      if (text.includes(item)) {
        speak(`${item} விலை ரூபாய் ${PRODUCTS[item]}`);
        return;
      }
    }
  }

  if (text.includes("மொத்த")) {
    const total = calculateTotal();
    speak(`மொத்த தொகை ரூபாய் ${total}`);
    return;
  }

  if (text.includes("மீண்டும்")) {
    if (Object.keys(bill).length === 0) {
      speak("பில் காலியாக உள்ளது.");
      return;
    }
    const summary = Object.entries(bill).map(([item, qty]) => `${qty} ${item}`);
    speak(`உங்கள் பிலில் ${summary.join(", ")}`);
    return;
  }

  if (text.includes("நீக்கு")) {
    let qty = getQuantityFromText(text);
    for (const item in bill) {
      if (text.includes(item)) {
        bill[item] -= qty;
        if (bill[item] <= 0) delete bill[item];
        updateBillDisplay();
        speak(`${qty} ${item} நீக்கப்பட்டது.`);
        return;
      }
    }
  }

  const parts = text.split(" மற்றும் ");
  const added = [];

  parts.forEach(part => {
    let qty = getQuantityFromText(part);
    for (const item in PRODUCTS) {
      if (part.includes(item)) {
        bill[item] = (bill[item] || 0) + qty;
        added.push(`${qty} ${item}`);
      }
    }
  });

  if (added.length) {
    updateBillDisplay();
    speak(`${added.join(" மற்றும் ")} சேர்க்கப்பட்டது.`);
    return;
  }

  speak("மன்னிக்கவும், புரியவில்லை.");
}

/* =====================
   BILL UI
===================== */
function updateBillDisplay() {
  let html = "<b>பில்</b><br>";
  let total = 0;

  for (const item in bill) {
    const cost = bill[item] * PRODUCTS[item];
    total += cost;
    html += `${item} x ${bill[item]} = ₹${cost}<br>`;
  }

  html += `<b>மொத்தம்: ₹${total}</b>`;
  DOM.bill.innerHTML = html;
}

/* =====================
   HELPERS
===================== */
function calculateTotal() {
  let total = 0;
  for (const item in bill) {
    total += bill[item] * PRODUCTS[item];
  }
  return total;
}

function getQuantityFromText(text) {
  for (const numWord in NUMBER_WORDS) {
    if (text.includes(numWord)) {
      return NUMBER_WORDS[numWord];
    }
  }
  return 1;
}

function speak(text) {
  addLog("🤖 " + text);
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = CONFIG.speechLang;
  try {
    speechSynthesis.speak(utterance);
  } catch (e) {
    console.error("Speech synthesis error:", e);
  }
}

function addLog(text) {
  DOM.log.innerHTML += text + "<br>";
  DOM.log.scrollTop = DOM.log.scrollHeight;
}

function updateStatus(text) {
  DOM.status.innerText = text;
}

function goBack() {
  window.location.href = 'index.html';
}

/* =====================
   EVENT LISTENERS
===================== */
DOM.backBtn.addEventListener("click", goBack);
DOM.speakBtn.addEventListener("click", startListening);
</script>

</body>
</html>
