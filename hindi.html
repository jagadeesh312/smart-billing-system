<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>स्मार्ट बिलिंग AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Billing AI — voice-enabled billing app">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<!-- TOP CONTROLS -->
<div class="btn-row">
  <button class="btn-back" aria-label="वापस जाएं">⬅ वापस</button>
  <button class="btn-speak" aria-label="बोलना शुरू करें">🎤 बोलिए</button>
</div>

<!-- MAIN APP -->
<div class="app">
  <h1>🧾 स्मार्ट बिलिंग AI</h1>
  <div class="status" id="status">बोलने के लिए दबाएँ</div>
  <div class="log" id="log"></div>
  <div class="bill" id="bill"></div>
</div>

<script>
/* =====================
   CONFIGURATION
===================== */
const CONFIG = {
  lang: "hi-IN",
  speechLang: "hi-IN"
};

/* =====================
   DATA
===================== */
const PRODUCTS = {
  "दूध": 60,
  "चावल": 55,
  "चीनी": 45,
  "ब्रेड": 40
};

const NUMBER_WORDS = {
  "एक": 1, "दो": 2, "तीन": 3, "चार": 4, "पांच": 5,
  "छह": 6, "सात": 7, "आठ": 8, "नौ": 9, "दस": 10
};

/* =====================
   DOM CACHE
===================== */
const DOM = {
  status: document.getElementById("status"),
  log: document.getElementById("log"),
  bill: document.getElementById("bill"),
  backBtn: document.querySelector(".btn-back"),
  speakBtn: document.querySelector(".btn-speak")
};

/* =====================
   STATE
===================== */
let bill = {};

/* =====================
   SPEECH SETUP
===================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = CONFIG.lang;
recognition.interimResults = false;

function startListening() {
  updateStatus("सुन रहा है...");
  try {
    recognition.start();
  } catch (e) {
    console.error("Recognition already started");
  }
}

recognition.onresult = (e) => {
  const text = e.results[0][0].transcript;
  addLog("👤 " + text);
  handleCommand(text);
};

recognition.onerror = (e) => {
  updateStatus("त्रुटि: " + e.error);
  console.error("Speech Recognition error:", e.error);
};

recognition.onend = () => updateStatus("बोलने के लिए दबाएँ");

/* =====================
   COMMAND HANDLER
===================== */
function handleCommand(text) {

  if (text.includes("तुम कौन हो")) {
    speak("मैं स्मार्ट बिलिंग एआई सिस्टम हूँ।");
    return;
  }

  if (text.includes("तुम्हें किसने बनाया")) {
    speak("मुझे एस बी ए एस टीम और जगदीश ने बनाया है।");
    return;
  }

  if (text.includes("तारीख")) {
    const today = new Date().toLocaleDateString(CONFIG.lang, {
      day: "numeric", month: "long", year: "numeric"
    });
    speak(`आज की तारीख ${today}`);
    return;
  }

  if (text.includes("क्लियर") || text.includes("सब हटाओ")) {
    bill = {};
    updateBillDisplay();
    speak("बिल साफ कर दिया गया है।");
    return;
  }

  if (text.includes("दाम") || text.includes("कीमत")) {
    for (const item in PRODUCTS) {
      if (text.includes(item)) {
        speak(`${item} का दाम ${PRODUCTS[item]} रुपये है`);
        return;
      }
    }
  }

  if (text.includes("कुल")) {
    const total = calculateTotal();
    speak(`कुल राशि ${total} रुपये है`);
    return;
  }

  if (text.includes("दोहराओ")) {
    if (Object.keys(bill).length === 0) {
      speak("बिल खाली है।");
      return;
    }
    const summary = Object.entries(bill).map(([item, qty]) => `${qty} ${item}`);
    speak(`आपके बिल में ${summary.join(", ")}`);
    return;
  }

  if (text.includes("हटाओ")) {
    let qty = getQuantityFromText(text);
    for (const item in bill) {
      if (text.includes(item)) {
        bill[item] -= qty;
        if (bill[item] <= 0) delete bill[item];
        updateBillDisplay();
        speak(`${qty} ${item} हटा दिया गया`);
        return;
      }
    }
  }

  const parts = text.split(" और ");
  const added = [];

  parts.forEach(part => {
    let qty = getQuantityFromText(part);
    for (const item in PRODUCTS) {
      if (part.includes(item)) {
        bill[item] = (bill[item] || 0) + qty;
        added.push(`${qty} ${item}`);
      }
    }
  });

  if (added.length) {
    updateBillDisplay();
    speak(`${added.join(" और ")} जोड़ा गया`);
    return;
  }

  speak("माफ़ कीजिए, मुझे समझ नहीं आया।");
}

/* =====================
   BILL UI
===================== */
function updateBillDisplay() {
  let html = "<b>बिल</b><br>";
  let total = 0;

  for (const item in bill) {
    const cost = bill[item] * PRODUCTS[item];
    total += cost;
    html += `${item} x ${bill[item]} = ₹${cost}<br>`;
  }

  html += `<b>कुल: ₹${total}</b>`;
  DOM.bill.innerHTML = html;
}

/* =====================
   HELPERS
===================== */
function calculateTotal() {
  let total = 0;
  for (const item in bill) {
    total += bill[item] * PRODUCTS[item];
  }
  return total;
}

function getQuantityFromText(text) {
  for (const numWord in NUMBER_WORDS) {
    if (text.includes(numWord)) {
      return NUMBER_WORDS[numWord];
    }
  }
  return 1;
}

function speak(text) {
  addLog("🤖 " + text);
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = CONFIG.speechLang;
  try {
    speechSynthesis.speak(utterance);
  } catch (e) {
    console.error("Speech synthesis error:", e);
  }
}

function addLog(text) {
  DOM.log.innerHTML += text + "<br>";
  DOM.log.scrollTop = DOM.log.scrollHeight;
}

function updateStatus(text) {
  DOM.status.innerText = text;
}

function goBack() {
  window.location.href = 'index.html';
}

/* =====================
   EVENT LISTENERS
===================== */
DOM.backBtn.addEventListener("click", goBack);
DOM.speakBtn.addEventListener("click", startListening);
</script>

</body>
</html>
