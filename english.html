<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Smart Billing AI — voice-enabled billing app">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<!-- TOP CONTROLS -->
<div class="btn-row">
  <button class="btn-back" aria-label="Go back">⬅ Back</button>
  <button class="btn-speak" aria-label="Start speaking">🎤 Speak</button>
</div>

<!-- MAIN APP -->
<div class="app">
  <h1>🧾 Smart Billing AI</h1>
  <div class="status" id="status">Tap and speak</div>
  <div class="log" id="log"></div>
  <div class="bill" id="bill"></div>
</div>

<script>
/* =====================
   CONFIGURATION
===================== */
const CONFIG = {
  lang: "en-IN",
  speechLang: "en-IN"
};

/* =====================
   DATA
===================== */
const PRODUCTS = {
  milk: 60,
  rice: 55,
  sugar: 45,
  bread: 40
};

const NUMBER_WORDS = {
  one: 1, two: 2, three: 3, four: 4, five: 5,
  six: 6, seven: 7, eight: 8, nine: 9, ten: 10
};

/* =====================
   DOM CACHE
===================== */
const DOM = {
  status: document.getElementById("status"),
  log: document.getElementById("log"),
  bill: document.getElementById("bill"),
  backBtn: document.querySelector(".btn-back"),
  speakBtn: document.querySelector(".btn-speak")
};

/* =====================
   STATE
===================== */
let bill = {};

/* =====================
   SPEECH SETUP
===================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = CONFIG.lang;
recognition.interimResults = false;

function startListening() {
  updateStatus("Listening...");
  try {
    recognition.start();
  } catch (e) {
    console.error("Recognition already started");
  }
}

recognition.onresult = (e) => {
  const text = e.results[0][0].transcript.toLowerCase();
  addLog("👤 " + text);
  handleCommand(text);
};

recognition.onerror = (e) => {
  updateStatus("Error: " + e.error);
  console.error("Speech Recognition error:", e.error);
};

recognition.onend = () => updateStatus("Tap and speak");

/* =====================
   COMMAND HANDLER
===================== */
function handleCommand(text) {
  // WHO ARE YOU
  if (text.includes("who are you")) {
    speak("I am Smart Billing AI System.");
    return;
  }

  // WHO CREATED YOU
  if (text.includes("who created you")) {
    speak("I was created by SBAS Team and Jagadeesh.");
    return;
  }

  // DATE
  if (text.includes("date")) {
    const today = new Date().toLocaleDateString(CONFIG.lang, {
      day: "numeric",
      month: "long",
      year: "numeric"
    });
    speak(`Today is ${today}`);
    return;
  }

  // CLEAR / REMOVE ALL
  if (text.includes("clear") || text.includes("remove all") || 
      text.includes("clear bill") || text.includes("remove everything")) {
    bill = {};
    updateBillDisplay();
    speak("Bill cleared.");
    return;
  }

  // PRICE QUERY
  if (text.includes("price")) {
    for (const item in PRODUCTS) {
      if (text.includes(item)) {
        speak(`The price of ${item} is rupees ${PRODUCTS[item]}`);
        return;
      }
    }
  }

  // TOTAL AMOUNT
  if (text.includes("total")) {
    const total = calculateTotal();
    speak(`Total amount is rupees ${total}`);
    return;
  }

  // REPEAT BILL
  if (text.includes("repeat")) {
    if (Object.keys(bill).length === 0) {
      speak("The bill is empty.");
      return;
    }
    const summary = Object.entries(bill).map(([item, qty]) => `${qty} ${item}`);
    speak(`Your bill has ${summary.join(", ")}`);
    return;
  }

  // REMOVE SINGLE ITEM
  if (text.includes("remove")) {
    let qty = getQuantityFromText(text);
    for (const item in bill) {
      if (text.includes(item)) {
        bill[item] -= qty;
        if (bill[item] <= 0) delete bill[item];
        updateBillDisplay();
        speak(`${qty} ${item} removed.`);
        return;
      }
    }
  }

  // ADD MULTIPLE ITEMS
  const parts = text.split(" and ");
  const added = [];

  parts.forEach(part => {
    let qty = getQuantityFromText(part);
    for (const item in PRODUCTS) {
      if (part.includes(item)) {
        bill[item] = (bill[item] || 0) + qty;
        added.push(`${qty} ${item}`);
      }
    }
  });

  if (added.length) {
    updateBillDisplay();
    speak(`${added.join(" and ")} added.`);
    return;
  }

  speak("Sorry, I did not understand.");
}

/* =====================
   BILL UI
===================== */
function updateBillDisplay() {
  let html = "<b>Bill</b><br>";
  let total = 0;

  for (const item in bill) {
    const cost = bill[item] * PRODUCTS[item];
    total += cost;
    html += `${item} x ${bill[item]} = ₹${cost}<br>`;
  }

  html += `<b>Total: ₹${total}</b>`;
  DOM.bill.innerHTML = html;
}

/* =====================
   HELPERS
===================== */
function calculateTotal() {
  let total = 0;
  for (const item in bill) {
    total += bill[item] * PRODUCTS[item];
  }
  return total;
}

function getQuantityFromText(text) {
  for (const numWord in NUMBER_WORDS) {
    if (text.includes(numWord)) {
      return NUMBER_WORDS[numWord];
    }
  }
  return 1;
}

function speak(text) {
  addLog("🤖 " + text);
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = CONFIG.speechLang;
  try {
    speechSynthesis.speak(utterance);
  } catch (e) {
    console.error("Speech synthesis error:", e);
  }
}

function addLog(text) {
  DOM.log.innerHTML += text + "<br>";
  DOM.log.scrollTop = DOM.log.scrollHeight;
}

function updateStatus(text) {
  DOM.status.innerText = text;
}

function goBack() {
  window.location.href = 'index.html';
}

/* =====================
   EVENT LISTENERS
===================== */
DOM.backBtn.addEventListener("click", goBack);
DOM.speakBtn.addEventListener("click", startListening);
</script>

</body>
</html>
